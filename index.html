<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Playlist - Array Data Structure</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: #18181b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #27272a; }
        h1 { font-size: 22px; margin-bottom: 5px; color: #22c55e; text-align: center; }
        p.subtitle { color: #a1a1aa; font-size: 13px; text-align: center; margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #3f3f46; background: #27272a; color: #fff; font-size: 14px; }
        button { background: #22c55e; color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #16a34a; }
        .playlist-header { font-size: 14px; color: #a1a1aa; margin-bottom: 10px; border-bottom: 1px solid #27272a; padding-bottom: 5px; }
        .song-item { display: flex; justify-content: space-between; align-items: center; background: #27272a; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; animation: fadeIn 0.3s ease; }
        .song-info { display: flex; align-items: center; gap: 12px; }
        .song-index { color: #71717a; font-size: 13px; font-weight: bold; }
        .song-name { font-weight: 500; font-size: 15px; }
        .delete-btn { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 12px; }
        .delete-btn:hover { background: #dc2626; }
        .empty-msg { color: #71717a; text-align: center; font-style: italic; margin-top: 30px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Music Playlist Queue</h1>
    <p class="subtitle">Demonstrating Ordered Arrays in a Real-World Media Application</p>

    <div class="input-group">
        <input type="text" id="songInput" placeholder="Enter track name and artist..." />
        <button onclick="addSong()">Add Track</button>
    </div>

    <div class="playlist-header">Current Array Queue</div>
    <div id="playlistContainer">
        <div class="empty-msg">Playlist is empty. Add a track above!</div>
    </div>
</div>

<script>
    // Core Array Data Structure
    let playlistArray = [
        "Blinding Lights - The Weeknd",
        "Shape of You - Ed Sheeran",
        "Levitating - Dua Lipa"
    ];

    function renderPlaylist() {
        const container = document.getElementById('playlistContainer');
        if (playlistArray.length === 0) {
            container.innerHTML = '<div class="empty-msg">Playlist is empty. Add a track above!</div>';
            return;
        }

        container.innerHTML = '';
        playlistArray.forEach((song, index) => {
            const item = document.createElement('div');
            item.className = 'song-item';
            item.innerHTML = `
                <div class="song-info">
                    <span class="song-index">[${index}]</span>
                    <span class="song-name">${song}</span>
                </div>
                <button class="delete-btn" onclick="removeSong(${index})">Remove</button>
            `;
            container.appendChild(item);
        });
    }

    function addSong() {
        const input = document.getElementById('songInput');
        const songName = input.value.trim();
        if (songName === "") return;

        // Push new element into the array maintaining sequence order
        playlistArray.push(songName);
        input.value = "";
        renderPlaylist();
    }

    function removeSong(index) {
        // Remove item from array by its index position
        playlistArray.splice(index, 1);
        renderPlaylist();
    }

    // Initial render
    renderPlaylist();
</script>

</body>
</html>
